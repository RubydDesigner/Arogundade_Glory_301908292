name: Generate README PDF

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/readme-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic

      - name: Create PDF from README.md
        run: pandoc README.md -o README.pdf --pdf-engine=xelatex -V geometry:margin=1in

      - name: Save updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update README PDF"
            git push
          fi
